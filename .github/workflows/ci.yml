name: Backend CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

jobs:
  backend-build:
    name: Backend build/test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Verify backend workspace
        run: |
          test -f README.md
          test -f .env.example
          test -f build.gradle
          test -f settings.gradle
          test -x gradlew
          test -d ai-service
          test -d infra

      - name: Build and test Spring Boot app
        run: ./gradlew clean test --no-daemon

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: backend-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t seongjiduk-backend:ci .

      - name: Build AI service image
        run: docker build -t seongjiduk-ai-service:ci ai-service
