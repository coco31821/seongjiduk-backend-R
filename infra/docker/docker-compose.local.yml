name: seongjiduk-local

services:
  mysql:
    image: mysql:8.4
    container_name: seongjiduk-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-seongjiduk}
      MYSQL_USER: ${MYSQL_USER:-seongjiduk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-seongjiduk-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-seongjiduk-root-password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - seongjiduk

  redis:
    image: redis:7-alpine
    container_name: seongjiduk-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - seongjiduk

  ai-service:
    build:
      context: ${AI_SERVICE_CONTEXT:-../../../seongjiduk-ai}
    container_name: seongjiduk-ai
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    networks:
      - seongjiduk

  backend:
    build:
      context: ../..
    container_name: seongjiduk-backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-seongjiduk}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-seongjiduk}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-seongjiduk-local-password}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - seongjiduk

volumes:
  mysql_data:

networks:
  seongjiduk:
    driver: bridge
