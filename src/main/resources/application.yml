spring:
  application:
    name: seongjiduk-backend
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/seongjiduk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}"
    username: ${SPRING_DATASOURCE_USERNAME:seongjiduk}
    password: ${SPRING_DATASOURCE_PASSWORD:seongjiduk-local-password}
  jpa:
    hibernate:
      # 스키마 변경은 Flyway만 담당한다. 운영에서 create/drop이 실행되는 사고를 막는다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

seongjiduk:
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    connect-timeout: ${AI_CONNECT_TIMEOUT:1s}
    trip-timeout: ${AI_TRIP_TIMEOUT:45s}
    describe-timeout: ${AI_DESCRIBE_TIMEOUT:90s}
    route-verify-timeout: ${AI_ROUTE_VERIFY_TIMEOUT:90s}
    # 임포트 직후 백그라운드 사전 생성에 쓸 모델 (비우면 ai-service 기본, 예: gpt-5.5)
    prewarm-model: ${AI_PREWARM_MODEL:}
  anitabi:
    base-url: ${ANITABI_BASE_URL:https://api.anitabi.cn}
  geocoding:
    google:
      api-key: ${GOOGLE_MAPS_API_KEY:}   # 비면 지오코딩 생략, 작품 city로 fallback
  naver:
    client-id: ${NAVER_CLIENT_ID:}       # 비면 블로그 동선 검증 비활성
    client-secret: ${NAVER_CLIENT_SECRET:}
  tosspayments:
    client-key: ${TOSS_CLIENT_KEY:}
    secret-key: ${TOSS_SECRET_KEY:}
  travelpayouts:
    # 어필리에이트 파트너 ID(공개값, 비밀 아님). 예약 딥링크에 붙어 수수료 트래킹. 비면 구글 폴백.
    marker: ${TRAVELPAYOUTS_MARKER:748641}
  redis-guard:
    # 독립 토글: off=대조군, local=단일 JVM, redis=분산.
    # REDIS_GUARD_MODE는 기존 배포 환경의 하위 호환용 fallback이며 새 배포는 각 MODE를 사용한다.
    cache-mode: ${CACHE_MODE:${REDIS_GUARD_MODE:redis}}
    rate-limit-mode: ${RATE_LIMIT_MODE:${REDIS_GUARD_MODE:redis}}
    concurrency-limit-mode: ${CONCURRENCY_LIMIT_MODE:${REDIS_GUARD_MODE:redis}}
    ai-max-concurrent: ${AI_MAX_CONCURRENT:4}   # ai-service 동시 호출 상한
    ai-wait-ms: ${AI_WAIT_MS:3000}              # 자리 대기 상한(초과 시 로컬 폴백)
    external-rpm: ${EXTERNAL_RPM:600}           # 네이버·구글 키별 분당 호출 상한
    ai-lease-ms: ${AI_LEASE_MS:120000}
    ai-heartbeat-ms: ${AI_HEARTBEAT_MS:20000}

custom:
  jwt:
    payload:
      issuer: ${JWT_ISSUER:seongjiduk}  # 토큰 발급자
      subject-access-token: ${JWT_SUBJECT_ACCESS_TOKEN:access-token}
      subject-refresh-token: ${JWT_SUBJECT_REFRESH_TOKEN:refresh-token}
    secrets:
      app-key: ${JWT_SECRET:change-me-local-secret-key-must-be-at-least-32-bytes} # JWT 서명에 쓰는 비밀키. TokenProvider.getSecretKey()에서 사용.
    validations:
      access: ${JWT_ACCESS_VALIDATION_MS:3600000}
      refresh: ${JWT_REFRESH_VALIDATION_MS:1209600000}
