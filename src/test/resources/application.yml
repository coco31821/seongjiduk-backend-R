spring:
  datasource:
    url: jdbc:h2:mem:seongjiduk-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

custom:
  jwt:
    payload:
      issuer: seongjiduk-test
      subject-access-token: access-token
      subject-refresh-token: refresh-token
      audiance: test
    secrets:
      app-key: test-secret-key-must-be-at-least-32-bytes-long
      vanillakey: test
    validations:
      access: 3600000
      refresh: 1209600000

seongjiduk:
  redis-guard:
    mode: local   # 테스트는 Redis 없이 인메모리 가드로 동작
